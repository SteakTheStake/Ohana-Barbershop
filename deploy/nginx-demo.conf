server {
    listen 80;
    listen [::]:80;
    server_name summitmc.xyz owner.summitmc.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/ohana-acme;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name summitmc.xyz;
    ssl_certificate /etc/letsencrypt/live/ohana-summitmc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohana-summitmc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ~ ^/(owner|admin)(/|$) {
        return 302 https://owner.summitmc.xyz$request_uri;
    }

    # Both hosts need the password form and logout endpoints.
    location / {
        include /etc/nginx/snippets/ohana-demo-proxy.conf;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name owner.summitmc.xyz;
    ssl_certificate /etc/letsencrypt/live/ohana-summitmc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ohana-summitmc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = / {
        return 302 /owner;
    }

    location / {
        include /etc/nginx/snippets/ohana-demo-proxy.conf;
    }
}
